name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.0); leave empty to only build'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        shell: bash
        run: |
          # Unset signing variables whose secret is missing; electron-builder treats an
          # empty CSC_LINK as a path to the working directory and fails with "not a file".
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          npx electron-builder ${{ matrix.target }} --publish never
          if [ "${{ matrix.target }}" = "--win" ]; then
            npx electron-builder --win nsis:arm64 --publish never
          fi
      - name: Check the installer opens its wizard
        if: matrix.target == '--win'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*/*-x64-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -PassThru
          $title = $null
          foreach ($i in 1..12) {
            Start-Sleep 5
            if ($p.HasExited) { throw "$($setup.Name) exited with code $($p.ExitCode) before showing its wizard" }
            $p.Refresh(); $title = $p.MainWindowTitle
            if ($title) { break }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $title) { throw "$($setup.Name) showed no window within 60s" }
          "$($setup.Name) opened '$title'"
        env:
          # Optional code signing — add these repository secrets to sign/notarize.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: quire-${{ matrix.os }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
          if-no-files-found: error

  release:
    # Tag pushes (v*), or manual runs given a tag, publish a GitHub Release with every installer attached.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          # On manual runs the tag is created at the built commit.
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
