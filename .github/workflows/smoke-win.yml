name: Windows smoke test (temporary)

on:
  push:
    branches: [claude/busy-galileo-mjs2ip]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        asset: [Quire-1.0.0-setup.exe, Quire-1.0.0-x64-setup.exe]
    steps:
      - name: Download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 -R ${{ github.repository }} -p '${{ matrix.asset }}' -O setup.exe

      - name: Interactive installer shows its wizard
        shell: pwsh
        run: |
          $p = Start-Process .\setup.exe -PassThru
          foreach ($i in 1..6) {
            Start-Sleep 5
            $procs = Get-Process setup -ErrorAction SilentlyContinue
            "t=$($i*5)s exited=$($p.HasExited) windows=[$(($procs | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle) -join ', ')]"
          }
          Get-Process setup -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'} -ErrorAction SilentlyContinue |
            Select-Object -First 3 | Format-List TimeCreated, Message
