appId: app.quire.pdf
productName: Quire
copyright: Copyright © 2026 Riley
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
# Where the in-app updater looks for new versions (src/main/updater.ts). CI uploads the installers and
# the latest*.yml files to GitHub Releases; electron-builder itself never publishes (--publish never).
publish:
  provider: github
  owner: RICKxxROLLING
  repo: quire-pdf
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Editor
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Quire
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  title: Quire ${version}
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Office
