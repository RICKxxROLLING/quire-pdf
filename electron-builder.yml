appId: app.quire.pdf
productName: Quire
copyright: Copyright © 2026 Riley
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Editor
win:
  icon: build/icon.png
  target:
    # One architecture per NSIS build: a combined x64+arm64 installer crashes in NSIS's
    # System.dll before showing its wizard. ARM installers come from `npm run dist:win`.
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Quire
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  title: Quire ${version}
linux:
  icon: build/icon.png
  target: [AppImage]
  category: Office
